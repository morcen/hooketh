[program:webhook-worker]
process_name=%(program_name)s_%(process_num)02d
; No --tries flag: SendWebhook defines its own tries()/backoff(), which
; always take precedence over the worker's CLI flags for that job. The
; actual retry ceiling is config('webhooks.max_retries'), enforced via the
; Delivery.attempt_count column (see app/Jobs/SendWebhook.php).
command=php /path/to/webhook-management-platform/artisan queue:work redis --sleep=3 --max-time=3600 --queue=webhooks
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/webhook-worker.log
stopwaitsecs=3600
