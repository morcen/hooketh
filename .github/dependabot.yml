version: 2
updates:
  # Docker base images (php:8.2-fpm-alpine, postgres:15-alpine, redis:7-alpine,
  # nginx:alpine, mailhog/mailhog) pinned in Dockerfile and docker-compose.yml.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions pinned in .github/workflows/*.yml (e.g. actions/checkout,
  # shivammathur/setup-php).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
